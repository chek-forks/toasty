# Docker Compose file to start all database management systems supported by Toasty.
# This makes it easier to run the tests locally, so long as you have Docker installed.
#
# Start with:
# ```
# docker compose up
# ```
#
# Environment variables for running tests:
#
# TOASTY_TEST_MYSQL_URL = "mysql://toasty:toasty@localhost:3306/toasty"
# TOASTY_TEST_POSTGRES_URL = "postgresql://toasty:toasty@localhost:5432/toasty"
# TOASTY_TEST_POSTGRES_TLS_URL = "postgresql://toasty:toasty@localhost:5433/toasty"
# TOASTY_TEST_DYNAMODB_URL = "dynamodb://localhost:8000"
# TOASTY_TEST_CASSANDRA_URL = "cassandra://127.0.0.1:9042/toasty_test"
#
# # DynamoDB specific environment variables
# AWS_REGION = "foo"
# AWS_EC2_METADATA_DISABLED="true"

name: toasty
version: "3.8"

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -port 8000 -inMemory
    ports:
      - "8000:8000"

  mysql:
    image: mysql:26
    environment:
      MYSQL_ROOT_PASSWORD: toasty_root_password
      MYSQL_USER: toasty
      MYSQL_PASSWORD: toasty
      MYSQL_DATABASE: toasty
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql:
    image: postgres:18
    environment:
      POSTGRES_USER: toasty
      POSTGRES_PASSWORD: toasty
      POSTGRES_DB: toasty
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "toasty"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql-tls:
    image: postgres:18
    environment:
      POSTGRES_USER: toasty
      POSTGRES_PASSWORD: toasty
      POSTGRES_DB: toasty
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5433:5432"
    volumes:
      - ./tests/tls/certs:/certs:ro
      - ./tests/tls/pg_hba.conf:/etc/pg_hba.conf:ro
      - ./tests/tls/setup-ssl.sh:/usr/local/bin/setup-ssl.sh:ro
    entrypoint: ["/usr/local/bin/setup-ssl.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/server.key
      - -c
      - ssl_ca_file=/var/lib/postgresql/ca.crt
      - -c
      - hba_file=/var/lib/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "toasty"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ScyllaDB speaks CQL, so the same driver and test suite cover Apache
  # Cassandra too. The `--smp`/`--memory` flags keep the container small enough
  # for a laptop, and the broadcast addresses make the node reachable through
  # Docker's port mapping.
  scylla:
    image: scylladb/scylla:6.2
    command:
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - "1"
      - --broadcast-address
      - 127.0.0.1
      - --broadcast-rpc-address
      - 127.0.0.1
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  scylla-data:

